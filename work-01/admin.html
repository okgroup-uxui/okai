<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리자 · 읏배구놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- 로그인 -->
<div class="gate" id="gate">
  <h2>관리자</h2>
  <p>읏배구놀이터 — 경기별 참여 현황과 현장 이벤트를 관리해요.</p>
  <div class="field"><label for="uid">아이디</label><input id="uid" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="아이디"></div>
  <div class="field"><label for="key">비밀번호</label><input id="key" type="password" autocomplete="current-password" placeholder="비밀번호"></div>
  <button class="btn" id="login">들어가기</button>
  <p class="status" id="gate-status"></p>
</div>

<!-- 본 화면 -->
<div id="app" hidden>
  <div class="topbar">
    <h1>읏배구놀이터 <span>관리자</span></h1>
    <div class="sp"></div>
    <select id="match" aria-label="경기 선택"></select>
    <span class="who" id="who"></span>
    <a class="btn small ghost" id="open-site" target="_blank" rel="noopener" title="이 경기 ID로 관람객 화면을 새 창에서 열어요" style="display:inline-flex; align-items:center; text-decoration:none;">관람객 화면 ↗</a>
    <span class="auto" id="auto"><i></i>5초마다 새로고침</span>
    <button class="btn small ghost" id="logout">나가기</button>
  </div>
  <div class="shell">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<!-- 엑셀 불러오기용 파일 선택 — 5초 새로고침으로 다시 그려지는 화면(#main) 밖에 둬야 파일 고르는 동안 사라지지 않아요 -->
<input type="file" id="sv-file" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="rp-file" accept="image/*" hidden>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal__box" id="modal-box"></div></div>

<script src="js/admin.js"></script>
</body>
</html>
