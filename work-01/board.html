<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>읏배구놀이터 전광판</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!--
  전광판 화면 — 경기장 전광판 PC에서 전체 화면(F11)으로 띄워두세요.
  관리자 › 대시보드 › 전광판에서 화면을 고르면 3초 안에 바뀌어요.
  주소: board.html (오늘 경기) · board.html?match=test-1 (테스트 경기)
  화면: 자동 순환 · 입장 QR · 응원 수 · MVP · 당첨자 발표 · 메시지
-->
<style>
  :root{ --brand:#FF571F; --brand-2:#FF8A5C; --ink:#fff; --dim:rgba(255,255,255,.62); --bg:#12161F; --gold:#FFD339; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg); color:var(--ink); font-family:Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow:hidden;}
  body{display:flex; flex-direction:column;}
  /* 1920×1080 기준으로 화면 크기에 맞게 */
  .stage{position:relative; flex:1; display:flex; align-items:center; justify-content:center; padding:4vh 5vw;
    background:radial-gradient(120% 90% at 85% 10%, rgba(255,87,31,.35), transparent 60%), radial-gradient(80% 70% at 5% 100%, rgba(255,138,92,.18), transparent 60%), var(--bg);}
  .court{position:absolute; inset:6vh 4vw; border:2px solid rgba(255,255,255,.06); border-radius:2vh; pointer-events:none;}
  .court::after{content:''; position:absolute; left:50%; top:0; bottom:0; border-left:2px solid rgba(255,255,255,.06);}
  .top{position:absolute; top:3.2vh; left:5vw; right:5vw; display:flex; align-items:center; justify-content:space-between; font-size:2.2vh; font-weight:700; color:var(--dim); z-index:2;}
  .top b{color:var(--ink);}
  .scene{position:relative; z-index:1; width:100%; display:none; text-align:center; animation:rise .7s cubic-bezier(.16,1,.3,1);}
  .scene.on{display:block;}
  @keyframes rise{from{opacity:0; transform:translateY(3vh) scale(.98);} to{opacity:1; transform:none;}}
  .eyebrow{font-size:3vh; font-weight:700; color:var(--brand-2); letter-spacing:.02em;}
  .big{font-size:19vh; line-height:1.05; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .mid{font-size:7vh; line-height:1.2; font-weight:800; letter-spacing:-.01em;}
  .sub{font-size:3vh; color:var(--dim); margin-top:2vh; font-weight:600;}
  /* QR */
  .qrwrap{display:flex; align-items:center; justify-content:center; gap:6vw; text-align:left;}
  .qr{width:46vh; height:46vh; padding:2.4vh; background:#fff; border-radius:3vh; box-shadow:0 2vh 6vh rgba(0,0,0,.4);}
  .qr svg{width:100%; height:100%; display:block;}
  .qr .fallback{color:#12161F; font-size:2vh; word-break:break-all; display:flex; align-items:center; justify-content:center; height:100%; text-align:center;}
  .qrtext .mid{font-size:8vh;}
  .qrtext .mid em{font-style:normal; color:var(--brand);}
  .steps{margin-top:4vh; display:flex; flex-direction:column; gap:1.6vh; font-size:3.2vh; font-weight:700;}
  .steps span{display:inline-flex; width:5vh; height:5vh; border-radius:50%; background:var(--brand); align-items:center; justify-content:center; margin-right:1.6vh; font-size:2.6vh;}
  /* 응원 */
  .cheer .big{background:linear-gradient(180deg, #fff 30%, #FFC2A8); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .pulse{display:inline-block; animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.03);}}
  /* MVP */
  .mvp .badge{display:inline-block; padding:1vh 3vh; border-radius:100px; background:var(--gold); color:#12161F; font-size:4vh; font-weight:800; margin-bottom:3vh;}
  .mvp .num{color:var(--gold);}
  /* 당첨자 */
  .wins{display:flex; flex-wrap:wrap; justify-content:center; gap:2.4vh 3vw; margin-top:5vh; max-width:85vw; margin-left:auto; margin-right:auto;}
  .wins span{font-size:6.4vh; font-weight:800; padding:1.6vh 4vh; border-radius:2vh; background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);
    opacity:0; animation:pop .6s cubic-bezier(.16,1,.3,1) forwards;}
  .wins.many span{font-size:4.2vh; padding:1.2vh 3vh;}
  @keyframes pop{from{opacity:0; transform:translateY(2vh) scale(.9);} to{opacity:1; transform:none;}}
  .msg .mid{font-size:9vh; max-width:85vw; margin:0 auto; word-break:keep-all;}
  .foot{position:absolute; bottom:3vh; left:5vw; right:5vw; display:flex; justify-content:space-between; font-size:2vh; color:rgba(255,255,255,.4); z-index:2;}
  .dot{display:inline-block; width:1.2vh; height:1.2vh; border-radius:50%; background:#22C55E; margin-right:1vh; vertical-align:middle;}
  .dot.off{background:#EF4444;}
  @media (prefers-reduced-motion: reduce){ .scene,.wins span,.pulse{animation:none; opacity:1;} }
</style>
</head>
<body>
<div class="stage">
  <div class="court" aria-hidden="true"></div>
  <div class="top"><span><b>OK저축은행 읏맨</b> <span id="vs"></span></span><span id="clock"></span></div>

  <section class="scene" id="s-qr" aria-label="입장 QR">
    <div class="qrwrap">
      <div class="qr" id="qr"></div>
      <div class="qrtext">
        <p class="eyebrow">읏배구놀이터</p>
        <p class="mid">QR 찍고<br><em>직관 미션</em> 시작!</p>
        <div class="steps">
          <p><span>1</span>출석체크 · 내 자리 찾기</p>
          <p><span>2</span>경기 예측 · MVP 투표</p>
          <p><span>3</span>룰렛 돌리고 경품 응모</p>
        </div>
      </div>
    </div>
  </section>

  <section class="scene cheer" id="s-cheer" aria-label="응원 수">
    <p class="eyebrow">지금까지 함께한 응원</p>
    <p class="big"><span class="pulse" id="cheer-n">0</span></p>
    <p class="sub">휴대폰에서 응원 버튼을 눌러주세요 · 접속 <b id="visitors">0</b>명</p>
  </section>

  <section class="scene mvp" id="s-mvp" aria-label="MVP">
    <p class="badge" id="mvp-title">MVP</p>
    <p class="big"><span class="num" id="mvp-num"></span> <span id="mvp-name"></span></p>
    <p class="sub">오늘 경기 MVP · 기록 탭에서 MVP 카드를 확인하세요</p>
  </section>

  <section class="scene" id="s-winners" aria-label="당첨자 발표">
    <p class="eyebrow">경품 추첨 당첨자</p>
    <p class="mid">축하합니다!</p>
    <div class="wins" id="wins"></div>
    <p class="sub">경품 수령처에서 응모 카드를 보여주세요</p>
  </section>

  <section class="scene msg" id="s-message" aria-label="메시지">
    <p class="eyebrow">읏배구놀이터</p>
    <p class="mid" id="msg"></p>
  </section>

  <div class="foot"><span><i class="dot" id="dot"></i><span id="status">연결 중…</span></span><span id="mid"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const API = 'https://okman-live.okgroup0425.workers.dev';   // index.html CONFIG.LIVE_API와 같아요
const params = new URLSearchParams(location.search);
const TEST = (params.get('match') || '').replace(/[^\w-]/g, '').slice(0, 64);
const MATCH = TEST || (()=>{ const t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); })();
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
$('mid').textContent = TEST ? `테스트 경기 · ${TEST}` : MATCH;

// 입장 QR — 같은 폴더의 index.html (테스트 경기면 ?match= 포함)
const SITE = new URL('index.html' + (TEST ? '?match=' + encodeURIComponent(TEST) : ''), location.href).href;
(function drawQR(){
  try{
    const q = qrcode(0, 'M'); q.addData(SITE); q.make();
    $('qr').innerHTML = q.createSvgTag({ cellSize:8, margin:0, scalable:true });
  }catch(e){ $('qr').innerHTML = `<p class="fallback">${esc(SITE)}</p>`; }
})();

setInterval(()=>{ const d = new Date(); $('clock').textContent = d.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }); }, 1000);

let B = null, shownTotal = 0, autoIdx = 0, autoAt = 0, current = '', winSig = '';
const AUTO_MS = 12000;

// 응원 수 — 부드럽게 올라가요
function animateTotal(to){
  const from = shownTotal, t0 = performance.now(), dur = 1200;
  shownTotal = to;
  const step = now => { const k = Math.min(1, (now - t0) / dur), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    $('cheer-n').textContent = v.toLocaleString('ko-KR'); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function scenes(){
  const list = ['qr', 'cheer'];
  if(B && B.mvp) list.push('mvp');
  if(B && B.winners && B.winners.length) list.push('winners');
  return list;
}
function show(name){
  if(name === current) return;
  current = name;
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === 's-' + name));
}
function paint(){
  if(!B) return show('qr');
  $('vs').textContent = B.opponent ? `vs ${B.opponent}` : '';
  if(B.total !== shownTotal) animateTotal(B.total || 0);
  $('visitors').textContent = (B.visitors || 0).toLocaleString('ko-KR');
  if(B.mvp){ $('mvp-title').textContent = B.mvp.title || 'MVP'; $('mvp-num').textContent = '#' + B.mvp.num; $('mvp-name').textContent = B.mvp.name || ''; }
  const sig = JSON.stringify(B.winners || []);
  if(sig !== winSig){
    winSig = sig;
    const w = B.winners || [];
    $('wins').className = 'wins' + (w.length > 8 ? ' many' : '');
    $('wins').innerHTML = w.map((n, i) => `<span style="animation-delay:${0.4 + i * 0.35}s">${esc(n)}</span>`).join('');
  }
  $('msg').textContent = (B.board && B.board.message) || '';
  let scene = (B.board && B.board.scene) || 'auto';
  if(scene === 'mvp' && !B.mvp) scene = 'auto';
  if(scene === 'winners' && !(B.winners || []).length) scene = 'auto';
  if(scene === 'message' && !(B.board && B.board.message)) scene = 'auto';
  if(scene !== 'auto') return show(scene);
  const list = scenes();
  if(Date.now() - autoAt > AUTO_MS || !list.includes(current)){ autoAt = Date.now(); show(list[autoIdx++ % list.length]); }
}
async function poll(){
  try{
    const r = await fetch(`${API}/live/${encodeURIComponent(MATCH)}/board`, { cache:'no-store' });
    if(!r.ok) throw new Error(r.status);
    B = await r.json();
    $('dot').className = 'dot'; $('status').textContent = '실시간 연결';
  }catch(e){ $('dot').className = 'dot off'; $('status').textContent = '연결 재시도 중…'; }
  paint();
}
poll();
setInterval(poll, 3000);
setInterval(paint, 1000);
// 전체 화면 — 화면을 한 번 누르면
document.addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); });
</script>
</body>
</html>
