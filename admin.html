<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>총관리 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --black:#F1F3F5;
    --panel:#ffffff;
    --panel-2:#EFEFEF;
    --line-dark:#dedad2;
    --ink:#111111;
    --muted:#545964;
    --muted-2:#4D5764;
    --line-strong:#111111;
    --white:#161C26;
    --accent:#FF571F;
    --accent-dark:#E64813;
    --danger:#EC3444;
  }
  *{box-sizing:border-box; font-family:'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    color:var(--white);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .admin-wrap{
    max-width:640px;
    margin:60px auto;
    padding:0 20px;
  }
  .admin-title{
    font-size:22px;
    font-weight:800;
    margin-bottom:6px;
  }
  .admin-sub{
    font-size:13px;
    color:var(--muted);
    margin-bottom:28px;
  }
  #authBox{
    background:var(--panel);
    border:1px solid var(--line-dark);
    border-radius:8px;
    padding:24px;
  }
  #authBox h3{margin:0 0 6px;}
  #authBox .sub{font-size:12px; color:var(--muted); margin-bottom:16px;}
  .input{
    width:100%;
    box-sizing:border-box;
    padding:10px 12px;
    border:1px solid var(--line-dark);
    border-radius:6px;
    font-size:14px;
    margin-bottom:8px;
  }
  .error{
    color:var(--danger);
    font-size:12px;
    margin:6px 0;
  }
  .btn{
    padding:10px 18px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .btn:hover{background:var(--accent); border-color:var(--accent);}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line-dark);
  }
  .btn.ghost:hover{border-color:var(--ink); background:var(--panel-2);}
  .btn.danger{
    background:var(--danger);
    border-color:var(--danger);
  }
  .btn.danger:hover{background:#c92a3c; border-color:#c92a3c;}
  .btn.danger.ghost{
    background:transparent;
    color:var(--danger);
    border:1px solid var(--danger);
  }
  .btn.danger.ghost:hover{background:var(--danger); color:#fff;}
  .btn:disabled{opacity:0.5; cursor:default;}
  #orgList .org-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--line-dark);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  #orgList .org-row .info{flex:1; min-width:0;}
  #orgList .org-row .name{font-weight:800; font-size:15px;}
  #orgList .org-row .sub{font-size:12px; color:var(--muted-2); margin-top:4px;}
  #orgList .org-row .btns{display:flex; gap:8px; flex:0 0 auto;}
  #orgList a.btn{text-decoration:none; display:inline-block;}
  .empty{font-size:13px; color:var(--muted);}

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:900;
    align-items:center;
    justify-content:center;
  }
  .modal-panel{
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line-dark);
    border-radius:8px;
    padding:24px;
    width:400px;
    max-width:90vw;
  }
  .modal-panel h3{margin:0 0 6px;}
  .modal-panel .sub{font-size:12px; color:var(--muted); margin-bottom:16px; line-height:1.6;}
  .modal-panel label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    margin:12px 0 6px;
  }
  .modal-panel label:first-of-type{margin-top:0;}
  .modal-btn-row{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
  }
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-title">🗂 총관리 대시보드</div>
  <div class="admin-sub">등록된 모든 부서를 한군데서 확인하고, 관리자를 재설정하거나 부서를 삭제할 수 있어요.</div>

  <div id="authBox">
    <h3 id="authTitle">총관리자 확인</h3>
    <div class="sub" id="authSub">비밀번호를 입력하세요.</div>
    <input type="password" id="passwordInput" class="input" placeholder="총관리자 비밀번호" autocomplete="off">
    <div class="error" id="authError" style="display:none;"></div>
    <button class="btn" id="authBtn">확인</button>
  </div>

  <div id="orgList" style="display:none;"></div>
</div>

<!-- 관리자 재설정 모달 -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-panel">
    <h3>관리자 재설정</h3>
    <div class="sub" id="resetModalSub"></div>
    <label>관리자 이름</label>
    <input type="text" id="resetNameInput" class="input" placeholder="예: 홍길동">
    <label>새 비밀번호<span style="font-weight:400; color:var(--muted-2);"> (비워두면 비밀번호는 그대로 유지)</span></label>
    <input type="password" id="resetPasswordInput" class="input" placeholder="새 비밀번호" autocomplete="new-password">
    <div class="error" id="resetModalError" style="display:none;"></div>
    <div class="modal-btn-row">
      <button class="btn ghost" id="resetModalCancel">취소</button>
      <button class="btn" id="resetModalSave">저장</button>
    </div>
  </div>
</div>

<!-- 부서 삭제 모달 -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-panel">
    <h3>부서 삭제</h3>
    <div class="sub" id="deleteModalSub"></div>
    <label>확인을 위해 부서명을 입력하세요</label>
    <input type="text" id="deleteConfirmInput" class="input" placeholder="">
    <div class="error" id="deleteModalError" style="display:none;"></div>
    <div class="modal-btn-row">
      <button class="btn ghost" id="deleteModalCancel">취소</button>
      <button class="btn danger" id="deleteModalConfirm">삭제</button>
    </div>
  </div>
</div>

<script>
// 이 파일이 쓰는 저장 백엔드는 index.html과 완전히 동일합니다.
// (worker.js에 목록 조회(list)·삭제(delete) 기능이 배포돼 있어야 부서 목록/삭제가 동작해요.)
const API_BASE_URL = "https://weekly-report.okgroup0425.workers.dev";
// 이 새 Worker에 API_KEY 시크릿을 설정해두셨다면 여기에 같은 값을 넣어주세요. 안 쓰셨다면 빈 문자열로 두세요.
const API_KEY = "027a9ffce49faa36daab9245698ea49e";
const SUPERADMIN_KEY = '__superadmin_passwordhash__';

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function fetchRawKV(key){
  const res = await fetch(`${API_BASE_URL}/?key=${encodeURIComponent(key)}`, {
    headers: { ...(API_KEY ? {'X-API-Key': API_KEY} : {}) }
  });
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error(`load failed: ${res.status} ${text}`);
  }
  const result = await res.json();
  if(result && result.value){
    try{ return JSON.parse(result.value); }catch(e){ return null; }
  }
  return null;
}
async function putRawKV(key, value){
  const res = await fetch(`${API_BASE_URL}/?key=${encodeURIComponent(key)}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      ...(API_KEY ? {'X-API-Key': API_KEY} : {})
    },
    body: JSON.stringify(value)
  });
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error(`save failed: ${res.status} ${text}`);
  }
  return true;
}
async function deleteRawKV(key){
  const res = await fetch(`${API_BASE_URL}/?key=${encodeURIComponent(key)}`, {
    method: 'DELETE',
    headers: { ...(API_KEY ? {'X-API-Key': API_KEY} : {}) }
  });
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error(`delete failed: ${res.status} ${text}`);
  }
  return true;
}
async function fetchKeyList(prefix){
  const res = await fetch(`${API_BASE_URL}/?list=1&prefix=${encodeURIComponent(prefix)}`, {
    headers: { ...(API_KEY ? {'X-API-Key': API_KEY} : {}) }
  });
  if(!res.ok){
    const text = await res.text().catch(()=>'');
    throw new Error(`list failed: ${res.status} ${text}`);
  }
  const data = await res.json();
  return data.items || [];
}
async function fetchOrgList(){
  return fetchKeyList('orgconfig:');
}

// 이 admin.html이 있는 폴더 기준으로, 부서용 메인 도구(index.html)를 연다.
// 메인 도구가 index.html이라 폴더 주소만으로 접속되므로 파일명은 비워둔다.
// 파일 이름을 직접 써야 하는 경우(예: weekly-report-agent.html)라면 따옴표 안에 그 이름을 넣어주세요.
const MAIN_APP_FILENAME = '';

// ===== 관리자 재설정 모달 =====
let resetTarget = null; // { item, cfg, orgCode }
function openResetModal(item, cfg, orgCode){
  resetTarget = { item, cfg, orgCode };
  document.getElementById('resetModalSub').textContent = `"${cfg.deptName || orgCode}" 부서의 관리자 이름/비밀번호를 재설정해요.`;
  document.getElementById('resetNameInput').value = cfg.adminName || '';
  document.getElementById('resetPasswordInput').value = '';
  document.getElementById('resetModalError').style.display = 'none';
  document.getElementById('resetModal').style.display = 'flex';
}
document.getElementById('resetModalCancel').addEventListener('click', () => {
  document.getElementById('resetModal').style.display = 'none';
});
document.getElementById('resetModalSave').addEventListener('click', async () => {
  if(!resetTarget) return;
  const errEl = document.getElementById('resetModalError');
  errEl.style.display = 'none';
  const newName = document.getElementById('resetNameInput').value.trim();
  const newPw = document.getElementById('resetPasswordInput').value;
  if(!newName){ errEl.textContent = '관리자 이름을 입력해주세요.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('resetModalSave');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  try{
    const { item, cfg } = resetTarget;
    cfg.adminName = newName;
    if(newPw) cfg.adminPasswordHash = await sha256Hex(newPw);
    await putRawKV(item.key, cfg);
    document.getElementById('resetModal').style.display = 'none';
    alert('관리자 정보를 재설정했어요. 새 이름' + (newPw ? '과 비밀번호를' : '을') + ' 해당 부서 관리자에게 전달해주세요.');
    renderOrgList();
  }catch(err){
    console.error('admin reset failed', err);
    errEl.textContent = '저장에 실패했어요. 잠시 후 다시 시도해주세요.';
    errEl.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '저장';
});

// ===== 부서 삭제 모달 =====
let deleteTarget = null; // { orgCode, deptName }
function openDeleteModal(orgCode, deptName){
  deleteTarget = { orgCode, deptName };
  document.getElementById('deleteModalSub').innerHTML =
    `"<b>${escapeHtml(deptName || orgCode)}</b>" 부서를 삭제해요. 이 부서의 팀/인원 설정과 그동안 작성된 모든 주간보고 데이터가 <b>영구히 삭제</b>되고, 되돌릴 수 없어요.`;
  document.getElementById('deleteConfirmInput').value = '';
  document.getElementById('deleteConfirmInput').placeholder = deptName || orgCode;
  document.getElementById('deleteModalError').style.display = 'none';
  document.getElementById('deleteModal').style.display = 'flex';
}
document.getElementById('deleteModalCancel').addEventListener('click', () => {
  document.getElementById('deleteModal').style.display = 'none';
});
document.getElementById('deleteModalConfirm').addEventListener('click', async () => {
  if(!deleteTarget) return;
  const errEl = document.getElementById('deleteModalError');
  errEl.style.display = 'none';
  const { orgCode, deptName } = deleteTarget;
  const typed = document.getElementById('deleteConfirmInput').value.trim();
  if(typed !== (deptName || orgCode)){
    errEl.textContent = '부서명이 일치하지 않아요.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('deleteModalConfirm');
  btn.disabled = true;
  btn.textContent = '삭제 중...';
  try{
    // 1) 이 부서의 주차별 데이터(업무보고/트렌드보고/발표순서)를 모두 찾아서 삭제
    const weekItems = await fetchKeyList(`weeklyreport:${orgCode}:`);
    await Promise.all(weekItems.map(w => deleteRawKV(w.key)));
    // 2) 부서 설정(팀/인원/관리자 정보) 자체를 삭제
    await deleteRawKV(`orgconfig:${orgCode}`);

    document.getElementById('deleteModal').style.display = 'none';
    alert('부서를 삭제했어요.');
    renderOrgList();
  }catch(err){
    console.error('org delete failed', err);
    errEl.textContent = '삭제에 실패했어요. 잠시 후 다시 시도해주세요.';
    errEl.style.display = 'block';
  }
  btn.disabled = false;
  btn.textContent = '삭제';
});

async function renderOrgList(){
  const listBox = document.getElementById('orgList');
  listBox.style.display = 'block';
  listBox.innerHTML = '<div class="empty">불러오는 중...</div>';
  let items;
  try{
    items = await fetchOrgList();
  }catch(err){
    console.error('org list failed', err);
    listBox.innerHTML = '<div class="error">부서 목록을 불러오지 못했어요. Worker에 목록 조회(list) 기능이 배포됐는지 확인해주세요.</div>';
    return;
  }
  if(!items.length){
    listBox.innerHTML = '<div class="empty">아직 등록된 부서가 없어요. 각 부서에 <code>?org=부서코드</code> 링크를 보내주면 그쪽에서 처음 설정하면서 등록돼요.</div>';
    return;
  }
  listBox.innerHTML = '';
  items.forEach(item => {
    let cfg = null;
    try{ cfg = JSON.parse(item.value); }catch(e){}
    if(!cfg || !item.key.startsWith('orgconfig:')) return;
    const orgCode = item.key.slice('orgconfig:'.length);
    const teamCount = (cfg.teams || []).length;
    const personCount = Object.values(cfg.roster || {}).reduce((sum, arr) => sum + (arr ? arr.length : 0), 0);

    const row = document.createElement('div');
    row.className = 'org-row';

    const info = document.createElement('div');
    info.className = 'info';
    info.innerHTML = `<div class="name">${escapeHtml(cfg.deptName || orgCode)}</div>
      <div class="sub">?org=${escapeHtml(orgCode)} · 팀 ${teamCount}개 · 인원 ${personCount}명 · 관리자: ${escapeHtml(cfg.adminName || '미지정')}</div>`;
    row.appendChild(info);

    const btns = document.createElement('div');
    btns.className = 'btns';

    const openBtn = document.createElement('a');
    openBtn.href = `./${MAIN_APP_FILENAME}?org=${encodeURIComponent(orgCode)}`;
    openBtn.target = '_blank';
    openBtn.className = 'btn ghost';
    openBtn.textContent = '열기';
    btns.appendChild(openBtn);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn ghost';
    resetBtn.textContent = '관리자 재설정';
    resetBtn.addEventListener('click', () => openResetModal(item, cfg, orgCode));
    btns.appendChild(resetBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn danger ghost';
    deleteBtn.textContent = '삭제';
    deleteBtn.addEventListener('click', () => openDeleteModal(orgCode, cfg.deptName));
    btns.appendChild(deleteBtn);

    row.appendChild(btns);
    listBox.appendChild(row);
  });
}

(async function init(){
  const authBox = document.getElementById('authBox');
  const errEl = document.getElementById('authError');
  const titleEl = document.getElementById('authTitle');
  const subEl = document.getElementById('authSub');

  let existingHash = null;
  try{ existingHash = await fetchRawKV(SUPERADMIN_KEY); }catch(err){ console.error('superadmin password load failed', err); }

  if(!existingHash){
    titleEl.textContent = '총관리자 비밀번호 설정 (최초 1회)';
    subEl.textContent = '앞으로 이 대시보드에 들어올 때 쓸 비밀번호를 정해주세요.';
  } else {
    titleEl.textContent = '총관리자 확인';
    subEl.textContent = '비밀번호를 입력하세요.';
  }

  document.getElementById('authBtn').addEventListener('click', async () => {
    const pw = document.getElementById('passwordInput').value;
    errEl.style.display = 'none';
    if(!pw){ errEl.textContent = '비밀번호를 입력해주세요.'; errEl.style.display = 'block'; return; }
    const hash = await sha256Hex(pw);
    if(!existingHash){
      try{
        await putRawKV(SUPERADMIN_KEY, hash);
        existingHash = hash;
        authBox.style.display = 'none';
        await renderOrgList();
      }catch(err){
        errEl.textContent = '저장에 실패했어요. 잠시 후 다시 시도해주세요.';
        errEl.style.display = 'block';
      }
    } else if(hash === existingHash){
      authBox.style.display = 'none';
      await renderOrgList();
    } else {
      errEl.textContent = '비밀번호가 맞지 않아요.';
      errEl.style.display = 'block';
    }
  });
  document.getElementById('passwordInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('authBtn').click();
  });
})();
</script>
</body>
</html>
