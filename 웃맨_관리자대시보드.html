<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>웃맨 직관 가이드 — 관리자</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#F7F7F9;
    --ink:#161C26;
    --ink-dim:#545964;
    --ink-faint:#8C94A2;

    --brand:#FF571F;
    --brand-dark:#E64813;
    --brand-light:#FF7A4E;

    --warning:#FFD339;
    --warning-text:#AD7E04;
    --positive-text:#137C09;
    --negative:#EC3444;

    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.72);
    --glass-tint:rgba(255,87,31,0.13);
    --glass-neg-tint:rgba(236,52,68,0.1);
    --glass-border-strong:rgba(255,255,255,0.9);
    --glass-shadow:0 10px 30px rgba(22,28,38,0.10);
    --blur-lg:26px;
    --blur-sm:14px;

    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-soft:cubic-bezier(.4,0,.2,1);

    --court-h:env(safe-area-inset-top);
    --court-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; position:relative;
  }
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .bg-orbs{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .bg-orbs .orb{position:absolute; border-radius:50%; filter:blur(80px); mix-blend-mode:multiply; will-change:transform;}
  .orb.o1{
    width:55vmax; height:55vmax; top:-28%; left:-18%;
    background:radial-gradient(circle at 40% 40%, var(--brand-light) 0%, transparent 68%);
    opacity:.28; animation:float1 26s var(--ease-soft) infinite;
  }
  .orb.o2{
    width:46vmax; height:46vmax; bottom:-20%; right:-14%;
    background:radial-gradient(circle at 60% 60%, var(--ink) 0%, transparent 68%);
    opacity:.1; animation:float2 30s var(--ease-soft) infinite;
  }
  @keyframes float1{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(6%,5%) scale(1.07);}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-6%,-6%) scale(1.08);}}
  @media (prefers-reduced-motion: reduce){ .bg-orbs .orb{animation:none;} }

  /* 모바일 기본, 900px 이상에서 넓게 */
  #app{max-width:640px; margin:0 auto; min-height:100vh; position:relative; z-index:1; padding:calc(16px + var(--court-h)) 18px calc(32px + var(--court-b));}
  @media (min-width:900px){ #app{max-width:1180px; padding:calc(28px + var(--court-h)) 40px 48px;} }

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap;}
  .topbar__title{display:flex; flex-direction:column; gap:2px;}
  .topbar__title h1{font-size:19px; font-weight:800; letter-spacing:-0.02em; margin:0; color:var(--ink);}
  .topbar__title span{font-size:12px; color:var(--ink-dim);}
  @media (min-width:900px){ .topbar__title h1{font-size:24px;} }

  .topbar__right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .match-select-wrap{position:relative;}
  .match-select{
    appearance:none; -webkit-appearance:none;
    padding:9px 34px 9px 14px; border-radius:12px; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--glass); border:1px solid var(--glass-border-strong); backdrop-filter:blur(var(--blur-sm));
    max-width:220px;
  }
  .match-select-wrap::after{
    content:''; position:absolute; right:12px; top:50%; width:8px; height:8px;
    border-right:1.6px solid var(--ink-faint); border-bottom:1.6px solid var(--ink-faint);
    transform:translateY(-65%) rotate(45deg); pointer-events:none;
  }
  .icon-btn{
    width:36px; height:36px; border-radius:12px;
    background:var(--glass); border:1px solid var(--glass-border-strong);
    backdrop-filter:blur(var(--blur-sm));
    display:flex; align-items:center; justify-content:center;
    transition:transform .25s var(--ease-spring); flex-shrink:0;
  }
  .icon-btn:active{transform:scale(.9);}
  .icon-btn svg{width:16px; height:16px; stroke:var(--ink-dim);}
  .icon-btn.spin svg{animation:spin .6s linear;}
  @keyframes spin{ from{transform:rotate(0);} to{transform:rotate(360deg);} }

  .card{
    background:var(--glass);
    backdrop-filter:blur(var(--blur-lg)) saturate(160%);
    -webkit-backdrop-filter:blur(var(--blur-lg)) saturate(160%);
    border:1px solid var(--glass-border-strong);
    box-shadow:var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,.7);
    border-radius:18px; padding:16px; position:relative; overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:8%; right:8%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity:.7;
  }
  .card + .card{margin-top:10px;}

  .btn{
    display:flex; align-items:center; justify-content:center; padding:13px; border-radius:14px;
    font-size:14.5px; font-weight:700; color:#fff;
    background:linear-gradient(150deg, var(--brand-light), var(--brand) 55%, var(--brand-dark));
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 8px 20px rgba(255,87,31,.28), inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .18s var(--ease-out);
  }
  .btn:active{transform:scale(0.97);}
  .btn.full{width:100%;}
  .btn[disabled]{background:var(--glass); color:var(--ink-faint); box-shadow:none; border:1px solid var(--glass-border-strong); pointer-events:none;}
  .btn.ghost{
    background:var(--glass); color:var(--ink-dim); border:1px solid var(--glass-border-strong); box-shadow:none;
  }
  .btn.danger{
    background:var(--glass-neg-tint); color:var(--negative); border:1px solid rgba(236,52,68,.3); box-shadow:none;
  }

  .glass-input{
    width:100%; padding:12px 14px; border-radius:12px;
    background:var(--glass); border:1px solid var(--glass-border-strong);
    backdrop-filter:blur(var(--blur-sm));
    font-size:14px; font-weight:600; color:var(--ink);
    margin-bottom:14px; appearance:none; -webkit-appearance:none;
  }
  .glass-input::placeholder{color:var(--ink-faint); font-weight:500;}

  .section-label{
    display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--brand-dark);
    margin:26px 0 12px;
  }
  .section-label:first-child{margin-top:0;}
  .section-label .num{
    width:18px; height:18px; border-radius:6px; background:var(--brand); color:#fff;
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .gate{display:none; padding:40px 4px; max-width:420px;}
  .gate.show{display:block;}
  .gate p{font-size:13px; color:var(--ink-dim); margin:0 0 16px; line-height:1.5;}
  .dash{display:none;}
  .dash.show{display:block;}

  /* ---- 반응형 레이아웃 ---- */
  .layout{display:block;}
  @media (min-width:900px){
    .layout{display:grid; grid-template-columns:320px 1fr; gap:24px; align-items:start;}
    .sidebar{position:sticky; top:24px;}
  }

  .summary{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px;}
  @media (min-width:900px){ .summary{grid-template-columns:repeat(2,1fr);} }
  .stat{
    background:var(--glass); border:1px solid var(--glass-border-strong); border-radius:14px;
    padding:16px 10px; text-align:center;
  }
  .stat .n{font-size:22px; font-weight:800; color:var(--brand-dark); font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px; color:var(--ink-dim); margin-top:3px; font-weight:600;}

  .blocks-grid{display:block;}
  @media (min-width:900px){ .blocks-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;} .blocks-grid .card{margin-top:0 !important;} }

  .block{margin-bottom:10px;}
  .block .q{font-size:13.5px; font-weight:700; color:var(--ink); margin:0 0 14px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .label{font-size:12.5px; font-weight:600; color:var(--ink-dim); width:36%; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-row .track{flex:1; height:9px; background:var(--glass); border:1px solid var(--glass-border-strong); border-radius:100px; overflow:hidden;}
  .bar-row .fill{height:100%; background:linear-gradient(90deg, var(--brand-dark), var(--brand)); border-radius:100px; width:0%; transition:width .6s var(--ease-spring);}
  .bar-row .count{font-size:11.5px; color:var(--ink-faint); width:44px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .empty{font-size:12.5px; color:var(--ink-faint); padding:10px 0;}
  .local-note{
    font-size:12px; color:var(--ink-dim); line-height:1.6; margin:0 0 20px;
    background:var(--glass-tint); border:1px solid rgba(255,87,31,.25); border-radius:12px; padding:14px;
  }
  .local-note b{color:var(--brand-dark);}

  /* ---- 경기 등록 ---- */
  .reg-card{margin-bottom:14px;}
  .reg-card summary{
    cursor:pointer; font-size:14.5px; font-weight:800; color:var(--ink); list-style:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  .reg-card summary::-webkit-details-marker{display:none;}
  .reg-card summary::after{content:'펼치기'; font-size:11px; font-weight:700; color:var(--brand-dark);}
  .reg-card[open] summary::after{content:'접기';}
  .reg-body{margin-top:16px;}
  .reg-row{display:flex; gap:10px;}
  .reg-row > div{flex:1;}
  .field-label{font-size:11.5px; font-weight:700; color:var(--ink-dim); margin:0 0 6px; display:block;}
  textarea.glass-input{resize:vertical; font-family:ui-monospace, 'SFMono-Regular', monospace; font-size:12px; line-height:1.6;}

  /* ---- 추첨 ---- */
  .draw-card .head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .draw-card h3{font-size:14.5px; font-weight:800; margin:0; color:var(--ink);}
  .draw-card .pool{font-size:12px; color:var(--ink-dim); margin:0 0 16px;}
  .draw-card .pool b{color:var(--brand-dark); font-variant-numeric:tabular-nums;}
  .draw-row{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .draw-row label{font-size:12px; font-weight:600; color:var(--ink-dim); flex-shrink:0;}
  .draw-row input{width:70px; text-align:center;}

  .draw-stage{
    min-height:52px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-border-strong);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
    font-size:14px; font-weight:700; color:var(--ink-faint); font-variant-numeric:tabular-nums;
    letter-spacing:.02em; overflow:hidden; padding:10px;
  }
  .draw-stage.spinning{color:var(--brand-dark); animation:pulseScale .12s ease-in-out infinite alternate;}
  @keyframes pulseScale{from{transform:scale(1);} to{transform:scale(1.02);}}

  .winner-list{list-style:none; margin:0; padding:0;}
  .winner-row{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid rgba(22,28,38,.06);
    opacity:0; animation:winnerIn .45s var(--ease-out) forwards;
  }
  .winner-row:last-child{border-bottom:none;}
  @keyframes winnerIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .winner-badge{
    width:26px; height:26px; border-radius:8px; flex-shrink:0;
    background:linear-gradient(150deg, var(--brand-light), var(--brand)); color:#fff;
    font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .winner-contact{flex:1; font-size:13px; font-weight:700; color:var(--ink); word-break:break-all;}
  .winner-source{font-size:10.5px; font-weight:700; color:var(--ink-faint); background:var(--glass); border:1px solid var(--glass-border-strong); padding:3px 8px; border-radius:100px; flex-shrink:0;}
  .winner-copy{flex-shrink:0; width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
  .winner-copy svg{width:14px; height:14px; stroke:var(--ink-faint);}
  .draw-actions{display:flex; gap:8px; margin-top:14px;}
  .draw-actions .btn{flex:1;}
  .draw-note{font-size:11px; color:var(--ink-faint); line-height:1.6; margin:14px 0 0;}
</style>
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar__title">
      <h1>관리자 대시보드</h1>
      <span id="topbar-sub">웃맨 직관 가이드 응답 현황</span>
    </div>
    <div class="topbar__right">
      <div class="match-select-wrap">
        <select class="match-select" id="match-select"></select>
      </div>
      <button class="icon-btn" id="refresh-btn" aria-label="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <a class="icon-btn" href="index.html" aria-label="직관 가이드로 돌아가기">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
    </div>
  </div>

  <div class="gate" id="gate">
    <div class="card">
      <p>관리자 암호를 입력하세요.</p>
      <input class="glass-input" type="password" id="pass-input" placeholder="암호">
      <button class="btn full" id="pass-submit">확인</button>
    </div>
  </div>

  <div class="dash" id="dash">
    <details class="card reg-card" id="reg-card">
      <summary>경기 등록</summary>
      <div class="reg-body">
        <div class="reg-row">
          <div>
            <label class="field-label">상대팀</label>
            <input class="glass-input" id="reg-away" placeholder="예: 대한항공">
          </div>
          <div>
            <label class="field-label">날짜</label>
            <input class="glass-input" id="reg-date" type="date">
          </div>
        </div>
        <label class="field-label">장소</label>
        <input class="glass-input" id="reg-venue" placeholder="부산 강서실내체육관" value="부산 강서실내체육관">
        <button class="btn full" id="reg-submit">이 정보로 경기 등록</button>
        <div id="reg-result" style="display:none;">
          <p class="field-label" style="margin-top:16px;">index.html의 CONFIG에 붙여넣을 코드</p>
          <textarea class="glass-input" id="reg-snippet" rows="7" readonly></textarea>
          <button class="btn ghost full" id="reg-copy">코드 복사</button>
          <p class="draw-note">이 등록은 지금 이 브라우저(로컬 데모)에만 저장돼요. 관람객이 보는 index.html에도 반영하려면 위 코드를 index.html의 CONFIG에 붙여넣고 다시 배포해주세요. 여러 사람이 함께 보는 실제 서비스에서는 API 모드로 백엔드에 경기를 등록하는 방식으로 바꾸는 걸 권장해요.</p>
        </div>
      </div>
    </details>
    <div id="dash-content"><!-- JS로 채움 --></div>
  </div>
</div>

<script>
/* ================================================================
   CONFIG — index.html의 CONFIG와 같은 값을 유지해주세요.
   (예측 문항·설문 문항·MVP 로스터가 서로 다르면 집계가 어긋나요)
   ================================================================ */
const CONFIG = {
  DATA_MODE: 'local', // index.html과 동일하게 맞춰주세요 — 'local' | 'api'
  API_BASE: '',        // 예: 'https://wm-api.yourname.workers.dev'

  MATCH_LABEL: 'OK저축은행 읏맨 직관 가이드',

  PREDICT_EVENTS: [
    { id:'first_point', q:'첫 득점 팀은 어디일까요?', options:['OK저축은행 읏맨','상대팀'] },
    { id:'first_block', q:'첫 블로킹을 성공시킬 선수는?', options:['#1 선수','#3 선수','#9 선수','#12 선수'] },
    { id:'set_score', q:'세트 스코어를 예측해보세요', options:['3:0','3:1','3:2','2:3 이하'] },
  ],

  SURVEY_QUESTIONS: [
    { q:'오늘 경기장 좌석 안내는 찾기 쉬웠나요?', options:['매우 쉬움','쉬움','보통','어려움'] },
    { q:'오늘 응원 분위기는 어땠나요?', options:['최고였어요','좋았어요','보통이었어요','아쉬웠어요'] },
    { q:'다음에도 직관하러 오실 의향이 있나요?', options:['꼭 다시 올게요','아마도요','잘 모르겠어요'] },
    { q:'경기장 내 편의시설(매점·화장실 등)은 만족스러웠나요?', options:['매우 만족','만족','보통','불만족'] },
  ],

  MVP_PLAYERS: [
    { num:1, name:'선수 A', pos:'아웃사이드 히터' },
    { num:3, name:'선수 B', pos:'세터' },
    { num:9, name:'선수 C', pos:'미들 블로커' },
    { num:12, name:'선수 D', pos:'리베로' },
    { num:17, name:'선수 E', pos:'아포짓' },
  ],

  // 관리자 접근 암호. 빈 문자열이면 암호 없이 바로 열려요.
  // 이 값은 페이지 소스에 그대로 노출되므로 실제 보안 장치는 아니에요 —
  // 캐주얼한 접근을 막는 용도로만 쓰고, 실제 운영에서는 이 페이지 자체를
  // 서버 인증 뒤에 두거나 링크를 공개적으로 노출하지 않는 걸 권장해요.
  ADMIN_PASSCODE: ''
};

const MATCH_REGISTRY_KEY = 'wm_guide_matches_v1';
function storageKeyFor(matchId){ return 'wm_guide_v1__' + matchId; }

function getMatchRegistry(){
  try{ return JSON.parse(localStorage.getItem(MATCH_REGISTRY_KEY)) || {}; }catch(e){ return {}; }
}

async function fetchJson(path){
  const res = await fetch(CONFIG.API_BASE + path);
  return res.json();
}

document.getElementById('topbar-sub').textContent = CONFIG.MATCH_LABEL + ' 응답 현황';

const gate = document.getElementById('gate');
const dash = document.getElementById('dash');
const dashContent = document.getElementById('dash-content');
const passInput = document.getElementById('pass-input');
const matchSelect = document.getElementById('match-select');

function init(){
  if(!CONFIG.ADMIN_PASSCODE){
    gate.classList.remove('show');
    start();
  } else {
    gate.classList.add('show');
  }
}
document.getElementById('pass-submit').addEventListener('click', checkPasscode);
passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') checkPasscode(); });
function checkPasscode(){
  if(passInput.value === CONFIG.ADMIN_PASSCODE){
    gate.classList.remove('show');
    start();
  } else {
    passInput.value = '';
    passInput.placeholder = '암호가 올바르지 않아요';
  }
}

async function start(){
  dash.classList.add('show');
  initRegistrationForm();
  await populateMatchSelector();
  matchSelect.addEventListener('change', openDashboard);
  openDashboard();
}

document.getElementById('refresh-btn').addEventListener('click', async (e)=>{
  e.currentTarget.classList.remove('spin'); void e.currentTarget.offsetWidth; e.currentTarget.classList.add('spin');
  if(dash.classList.contains('show')){
    await populateMatchSelector(matchSelect.value);
    openDashboard();
  }
});

/* ================================================================
   경기 등록 — 경기별로 데이터가 쌓이도록 경기를 미리 만들어둡니다.
   로컬 데모에서는 이 브라우저의 레지스트리에만 기록되고, 관람객이
   보는 index.html에는 자동으로 반영되지 않아요(서로 다른 정적 파일이라
   실시간으로 이어져 있지 않기 때문) — 그래서 생성된 코드를 index.html의
   CONFIG에 직접 붙여넣도록 안내해요. API 모드에서는 아래 fetch가
   백엔드의 경기 목록에 실제로 새 경기를 추가합니다.
   ================================================================ */
function initRegistrationForm(){
  const dateInput = document.getElementById('reg-date');
  if(!dateInput.value) dateInput.value = new Date().toISOString().slice(0, 10);

  document.getElementById('reg-submit').addEventListener('click', async ()=>{
    const away = document.getElementById('reg-away').value.trim() || '상대팀';
    const date = document.getElementById('reg-date').value || new Date().toISOString().slice(0, 10);
    const venue = document.getElementById('reg-venue').value.trim() || '부산 강서실내체육관';
    const matchId = date;
    const label = `OK저축은행 읏맨 vs ${away} · ${date}`;

    if(CONFIG.DATA_MODE === 'api'){
      try{
        await fetch(CONFIG.API_BASE + '/admin/matches', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: matchId, label, away, venue, date })
        });
      }catch(e){}
    } else {
      const reg = getMatchRegistry();
      reg[matchId] = { id: matchId, label, updatedAt: Date.now(), manual: true };
      localStorage.setItem(MATCH_REGISTRY_KEY, JSON.stringify(reg));
    }

    await populateMatchSelector(matchId);
    await openDashboard();

    const snippet =
`MATCH_ID: '${matchId}',
MATCH: {
  home: 'OK저축은행 읏맨',
  away: '${away}',
  venue: '${venue}',
  date: '${date}'
},`;
    document.getElementById('reg-snippet').value = snippet;
    document.getElementById('reg-result').style.display = 'block';
  });

  document.getElementById('reg-copy').addEventListener('click', ()=>{
    navigator.clipboard?.writeText(document.getElementById('reg-snippet').value).catch(()=>{});
  });
}

// 실제 배포 시: CONFIG.API_BASE + '/admin/matches' 에서
// [{ id, label }, ...] 형태로 지금까지 진행된 경기 목록을 내려주면
// 이 함수가 그대로 select 옵션을 채웁니다.
async function populateMatchSelector(preserveId){
  let matches;
  if(CONFIG.DATA_MODE === 'api'){
    try{ matches = await fetchJson('/admin/matches'); }catch(e){ matches = []; }
  } else {
    const reg = getMatchRegistry();
    matches = Object.values(reg).sort((a,b)=> b.updatedAt - a.updatedAt);
  }
  const prev = preserveId || matchSelect.value;
  matchSelect.innerHTML = '';
  if(!matches.length){
    const opt = document.createElement('option');
    opt.value = new Date().toISOString().slice(0,10);
    opt.textContent = '오늘 (' + opt.value + ') · 데이터 없음';
    matchSelect.appendChild(opt);
    return;
  }
  matches.forEach(m=>{
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = m.label || m.id;
    matchSelect.appendChild(opt);
  });
  if(prev && matches.some(m=> m.id === prev)) matchSelect.value = prev;
}

async function openDashboard(){
  dashContent.innerHTML = `<p class="empty">불러오는 중...</p>`;
  const matchId = matchSelect.value;
  const data = await loadAdminData(matchId);
  renderDashboard(data, matchId);
}

// 실제 배포 시: CONFIG.API_BASE + '/matches/' + matchId + '/admin/summary' 에서
// 전체 관람객의 집계 데이터를
// { predictions, survey, mvp, raffleEntries, participantCounts } 형태로
// 내려주도록 백엔드를 구현하면 이 함수가 그대로 그 데이터를 사용합니다.
async function loadAdminData(matchId){
  if(CONFIG.DATA_MODE === 'api'){
    return fetchJson(`/matches/${matchId}/admin/summary`);
  }
  let LOCAL = {};
  try{ LOCAL = JSON.parse(localStorage.getItem(storageKeyFor(matchId))) || {}; }catch(e){}

  const predictions = LOCAL['predictions'] || null;
  const survey = LOCAL['survey'] || null;
  const mvpCounts = LOCAL['mvp_counts'] || {};
  const raffleEntries = LOCAL['raffle_entries'] || [];

  const predictResult = {};
  CONFIG.PREDICT_EVENTS.forEach(ev=>{
    const counts = {};
    ev.options.forEach(o=> counts[o] = 0);
    if(predictions && predictions[ev.id] != null) counts[predictions[ev.id]] = 1;
    predictResult[ev.id] = counts;
  });

  const surveyResult = {};
  CONFIG.SURVEY_QUESTIONS.forEach((q, i)=>{
    const counts = {};
    q.options.forEach(o=> counts[o] = 0);
    if(survey && survey[i] != null) counts[survey[i]] = 1;
    surveyResult[i] = counts;
  });

  return {
    predictions: predictResult,
    survey: surveyResult,
    mvp: mvpCounts,
    raffleEntries,
    participantCounts: {
      predict: predictions ? 1 : 0,
      survey: survey ? 1 : 0,
      mvp: Object.values(mvpCounts).reduce((a,b)=>a+b, 0)
    },
    isLocalDemo: true
  };
}

function barBlockHtml(title, countsMap, orderedLabels){
  const total = Object.values(countsMap).reduce((a,b)=>a+b, 0);
  const rows = orderedLabels.map(label=>{
    const c = countsMap[label] || 0;
    const pct = total ? Math.round((c/total)*100) : 0;
    return `<div class="bar-row">
      <span class="label">${label}</span>
      <span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="count">${c}표</span>
    </div>`;
  }).join('');
  return `<div class="card block"><p class="q">${title}</p>${rows}</div>`;
}

function renderDashboard(data, matchId){
  let html = '';

  if(data.isLocalDemo){
    html += `<p class="local-note"><b>로컬 데모 모드</b> — 지금은 이 브라우저에 저장된 응답만 보여요. index.html을 같은 브라우저에서 열어 참여해보면 여기 반영돼요. 실제 서비스에서 전체 관람객 집계를 보려면 CONFIG.DATA_MODE를 'api'로 바꾸고 백엔드를 연동해주세요.</p>`;
  }

  const raffleCount = new Set((data.raffleEntries || []).map(e=> e.contact)).size;

  html += `<div class="layout">`;

  // ---- 사이드바: 요약 + 추첨 ----
  html += `<div class="sidebar">`;
  html += `<div class="summary">
    <div class="stat"><div class="n">${data.participantCounts.predict}</div><div class="l">예측 참여</div></div>
    <div class="stat"><div class="n">${data.participantCounts.survey}</div><div class="l">설문 참여</div></div>
    <div class="stat"><div class="n">${data.participantCounts.mvp}</div><div class="l">MVP 투표</div></div>
    <div class="stat"><div class="n">${raffleCount}</div><div class="l">추첨 응모</div></div>
  </div>`;
  html += renderDrawCardHtml(data.raffleEntries || []);
  html += `</div>`; // .sidebar

  // ---- 메인: 예측/설문/MVP 결과 ----
  html += `<div class="main">`;
  html += `<div class="section-label"><span class="num">1</span>예측 이벤트 결과</div>`;
  html += `<div class="blocks-grid">`;
  CONFIG.PREDICT_EVENTS.forEach(ev=>{
    html += barBlockHtml(ev.q, data.predictions[ev.id] || {}, ev.options);
  });
  html += `</div>`;

  html += `<div class="section-label"><span class="num">2</span>설문 결과</div>`;
  html += `<div class="blocks-grid">`;
  CONFIG.SURVEY_QUESTIONS.forEach((q, i)=>{
    html += barBlockHtml(q.q, data.survey[i] || {}, q.options);
  });
  html += `</div>`;

  html += `<div class="section-label"><span class="num">3</span>MVP 투표 결과</div>`;
  const mvpLabels = CONFIG.MVP_PLAYERS
    .slice()
    .sort((a,b)=> (data.mvp[b.num]||0) - (data.mvp[a.num]||0))
    .map(p=> `${p.num} ${p.name}`);
  const mvpCounts = {};
  CONFIG.MVP_PLAYERS.forEach(p=>{ mvpCounts[`${p.num} ${p.name}`] = data.mvp[p.num] || 0; });
  html += barBlockHtml('선수별 득표', mvpCounts, mvpLabels);
  html += `</div>`; // .main

  html += `</div>`; // .layout

  dashContent.innerHTML = html;
  wireDrawCard(data.raffleEntries || [], matchId);
}

/* ================================================================
   추첨 — 공정한 난수 기반으로 골라요 ("AI"라는 이름의 모델이 임의로
   당첨자를 고르는 방식은 편향·재현성 문제가 있어, crypto 난수로 뽑고
   화면 연출만 추첨답게 꾸몄어요).
   ================================================================ */
function renderDrawCardHtml(entries){
  const pool = dedupeEntries(entries);
  return `
  <div class="card draw-card" id="draw-card">
    <div class="head"><h3>당첨자 추첨</h3></div>
    <p class="pool">현재 응모자 <b>${pool.length}</b>명</p>
    <div class="draw-row">
      <label for="draw-count">당첨 인원</label>
      <input class="glass-input" style="margin-bottom:0;" type="number" id="draw-count" min="1" max="${Math.max(pool.length,1)}" value="1" ${pool.length ? '' : 'disabled'}>
    </div>
    <div class="draw-stage" id="draw-stage">추첨을 시작해보세요</div>
    <button class="btn full" id="draw-start" ${pool.length ? '' : 'disabled'}>AI 추첨 시작</button>
    <ul class="winner-list" id="winner-list"></ul>
    <div class="draw-actions" id="draw-actions" style="display:none;">
      <button class="btn ghost" id="draw-copy">목록 복사</button>
      <button class="btn ghost" id="draw-redo">다시 추첨</button>
    </div>
    <button class="btn danger full" id="draw-clear" style="margin-top:10px;" ${pool.length ? '' : 'disabled'}>응모자 데이터 삭제</button>
    <p class="draw-note">공정한 난수(crypto)로 추첨해요. 당첨자 안내 후에는 개인정보 보호를 위해 응모자 데이터를 삭제해주세요.</p>
  </div>`;
}

function dedupeEntries(entries){
  const seen = new Set();
  const out = [];
  entries.forEach(e=>{
    if(!e || !e.contact || seen.has(e.contact)) return;
    seen.add(e.contact);
    out.push(e);
  });
  return out;
}

function maskContact(contact){
  if(contact.includes('@')){
    const [a, b] = contact.split('@');
    return a.slice(0, Math.max(1, a.length-2)) + '**@' + b;
  }
  return contact.replace(/(\d{2,3})\d{2,4}(\d{2,4})$/, '$1****$2');
}

function secureShuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const rand = crypto.getRandomValues(new Uint32Array(1))[0] / (0xFFFFFFFF + 1);
    const j = Math.floor(rand * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function wireDrawCard(entries, matchId){
  const pool = dedupeEntries(entries);
  const stage = document.getElementById('draw-stage');
  const startBtn = document.getElementById('draw-start');
  const countInput = document.getElementById('draw-count');
  const listEl = document.getElementById('winner-list');
  const actionsEl = document.getElementById('draw-actions');
  const clearBtn = document.getElementById('draw-clear');
  let lastWinners = [];
  let spinTimer = null;

  if(!startBtn) return;

  startBtn.addEventListener('click', ()=>{
    if(!pool.length) return;
    const n = Math.min(Math.max(1, parseInt(countInput.value, 10) || 1), pool.length);
    listEl.innerHTML = '';
    actionsEl.style.display = 'none';
    startBtn.setAttribute('disabled', 'true');
    stage.classList.add('spinning');

    let spins = 0;
    const maxSpins = 16;
    spinTimer = setInterval(()=>{
      const r = pool[Math.floor(Math.random() * pool.length)];
      stage.textContent = maskContact(r.contact);
      spins++;
      if(spins >= maxSpins){
        clearInterval(spinTimer);
        finishDraw(n);
      }
    }, 80);
  });

  function finishDraw(n){
    stage.classList.remove('spinning');
    const winners = secureShuffle(pool).slice(0, n);
    lastWinners = winners;
    stage.textContent = `${winners.length}명 당첨!`;
    listEl.innerHTML = '';
    winners.forEach((w, i)=>{
      const li = document.createElement('li');
      li.className = 'winner-row';
      li.style.animationDelay = (i * 0.08) + 's';
      li.innerHTML = `
        <div class="winner-badge">${i+1}</div>
        <div class="winner-contact">${w.contact}</div>
        <span class="winner-source">${w.source === 'survey' ? '설문' : '예측'}</span>
        <button class="winner-copy" data-contact="${w.contact}" aria-label="복사">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      `;
      listEl.appendChild(li);
    });
    listEl.querySelectorAll('.winner-copy').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        navigator.clipboard?.writeText(btn.dataset.contact).catch(()=>{});
      });
    });
    actionsEl.style.display = 'flex';
    startBtn.removeAttribute('disabled');
  }

  document.getElementById('draw-redo').addEventListener('click', ()=> startBtn.click());
  document.getElementById('draw-copy').addEventListener('click', ()=>{
    const text = lastWinners.map(w=> w.contact).join('\n');
    navigator.clipboard?.writeText(text).catch(()=>{});
  });

  clearBtn.addEventListener('click', ()=>{
    if(!pool.length) return;
    const ok = confirm(`응모자 ${pool.length}명의 연락처 데이터를 모두 삭제할까요? 이 작업은 되돌릴 수 없어요.`);
    if(!ok) return;
    if(CONFIG.DATA_MODE === 'local'){
      try{
        const key = storageKeyFor(matchId);
        const obj = JSON.parse(localStorage.getItem(key)) || {};
        delete obj['raffle_entries'];
        localStorage.setItem(key, JSON.stringify(obj));
      }catch(e){}
      openDashboard();
    } else {
      // 실제 배포 시: DELETE {API_BASE}/matches/{matchId}/raffle_entries 등으로 교체하세요.
      alert('API 모드에서는 백엔드에 삭제 엔드포인트를 연결해주세요.');
    }
  });
}

init();
</script>
